name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk 100Mgoal.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest 100Mgoal.apk \
            --title "1억 가계부 (최신 빌드 #${{ github.run_number }})" \
            --notes "휴대폰에서 100Mgoal.apk를 눌러 다운로드한 뒤 설치하세요. 기존 앱 위에 그대로 업데이트되고 기록은 유지됩니다."
